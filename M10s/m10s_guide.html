<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- ═══════════════════════════════════════════════════════════════════════
         CONFIGURATION - CHANGE THESE FOR EACH FIGHT
         ═══════════════════════════════════════════════════════════════════════ -->
    <script>
        // Which JSON file to load (CHANGE THIS FOR EACH FIGHT)
        const GUIDE_JSON_FILE = 'm10s_guide.json';
        
        // Page title (appears in browser tab)
        const PAGE_TITLE = 'M10S - Vamp Fatale';
    </script>
    
    <title>FFXIV Raid Guide Viewer</title>
    
    <!-- ═══════════════════════════════════════════════════════════════════════
         COLOR CUSTOMIZATION (OPTIONAL)
         Change these hex codes to customize colors for this fight
         ═══════════════════════════════════════════════════════════════════════ -->
    <style>
        :root {
            /* Main background colors */
            --bg-primary: #0a0e27;        /* Dark blue background */
            --bg-secondary: #151934;      /* Slightly lighter blue */
            --bg-card: #1a1f3a;          /* Card backgrounds */
            
            /* Accent colors - CHANGE THESE for different fight themes */
            --accent-pink: #ff6b9d;      /* Pink highlights (try #ff4500 for orange, #7209b7 for purple) */
            --accent-blue: #4cc9f0;      /* Blue badges (try #00d9ff for cyan, #06ffa5 for green) */
            --accent-purple: #7209b7;    /* Purple gradients */
            
            /* Status colors (usually keep these) */
            --text-primary: #f0f0f0;     /* Main text color */
            --text-secondary: #a0a0b0;   /* Dimmer text */
            --success: #06ffa5;          /* Green (tips, timestamps) */
            --warning: #ffd60a;          /* Yellow (warnings) */
            --danger: #ff5e5b;           /* Red (not used yet) */
        }
    </style>
    
    <!-- ═══════════════════════════════════════════════════════════════════════
         END CONFIGURATION - Don't change anything below this line
         ═══════════════════════════════════════════════════════════════════════ -->
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, var(--bg-primary) 0%, var(--bg-secondary) 100%);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        /* Header */
        header {
            text-align: center;
            padding: 40px 20px;
            margin-bottom: 40px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
        }

        h1 {
            font-size: 3rem;
            font-weight: 900;
            background: linear-gradient(135deg, var(--accent-pink), var(--accent-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
            letter-spacing: -1px;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 1.2rem;
        }

        /* Navigation */
        .nav-container {
            position: sticky;
            top: 20px;
            background: var(--bg-card);
            padding: 20px;
            border-radius: 16px;
            margin-bottom: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 100;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .nav-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            user-select: none;
        }

        .nav-title {
            font-weight: 700;
            color: var(--accent-pink);
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-toggle {
            font-size: 1.5rem;
            color: var(--text-secondary);
            transition: transform 0.3s ease;
        }

        .nav-container.collapsed .nav-toggle {
            transform: rotate(-90deg);
        }

        .nav-content {
            max-height: 500px;
            overflow-y: auto;
            overflow-x: hidden;
            transition: max-height 0.3s ease;
            margin-top: 15px;
            padding-right: 8px;
        }

        .nav-content::-webkit-scrollbar {
            width: 8px;
        }

        .nav-content::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 4px;
        }

        .nav-content::-webkit-scrollbar-thumb {
            background: var(--accent-pink);
            border-radius: 4px;
        }

        .nav-content::-webkit-scrollbar-thumb:hover {
            background: var(--accent-blue);
        }

        .nav-container.collapsed .nav-content {
            max-height: 0;
            margin-top: 0;
        }

        .nav-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 8px;
        }

        .nav-link {
            color: var(--text-secondary);
            text-decoration: none;
            padding: 12px 16px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.03);
            transition: all 0.2s ease;
            font-size: 0.9rem;
            display: block;
        }

        .nav-link:hover {
            background: rgba(255, 107, 157, 0.15);
            color: var(--accent-pink);
            transform: translateX(4px);
        }

        .category-badge {
            font-size: 0.75rem;
            padding: 2px 8px;
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.1);
            display: inline-block;
            width: fit-content;
        }

        /* Mechanic Cards */
        .mechanic-card {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 24px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .mechanic-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 40px rgba(255, 107, 157, 0.2);
            border-color: var(--accent-pink);
        }

        .mechanic-header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 20px;
            cursor: pointer;
        }

        .mechanic-number {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, var(--accent-pink), var(--accent-purple));
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 1.5rem;
            flex-shrink: 0;
        }

        .mechanic-title-group {
            flex: 1;
        }

        .mechanic-title {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 4px;
        }

        .mechanic-category {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            background: rgba(76, 201, 240, 0.2);
            color: var(--accent-blue);
        }

        .mechanic-timestamp {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            background: rgba(6, 255, 165, 0.2);
            color: var(--success);
            margin-left: 8px;
        }

        .mechanic-damage {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            background: rgba(255, 94, 91, 0.2);
            color: var(--danger);
            margin-left: 8px;
        }

        .collapse-icon {
            font-size: 1.5rem;
            color: var(--text-secondary);
            transition: transform 0.3s ease;
        }

        .mechanic-card.collapsed .collapse-icon {
            transform: rotate(-90deg);
        }

        .mechanic-content {
            max-height: 5000px;
            overflow: hidden;
            transition: max-height 0.3s ease;
        }

        .mechanic-card.collapsed .mechanic-content {
            max-height: 0;
        }

        .mechanic-description {
            font-size: 1.1rem;
            line-height: 1.8;
            margin-bottom: 24px;
            color: var(--text-primary);
            padding: 16px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 8px;
            border-left: 3px solid var(--accent-blue);
        }

        /* Steps */
        .steps-list {
            margin: 20px 0;
        }

        .step-item {
            margin-bottom: 16px;
            padding-left: 32px;
            position: relative;
        }

        .step-item::before {
            content: '';
            position: absolute;
            left: 8px;
            top: 8px;
            width: 12px;
            height: 12px;
            background: var(--success);
            border-radius: 50%;
            box-shadow: 0 0 12px var(--success);
        }

        .step-text {
            font-size: 1.05rem;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        .substeps {
            margin-left: 24px;
            margin-top: 12px;
        }

        .substep {
            padding: 8px 12px;
            margin-bottom: 8px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 6px;
            border-left: 2px solid var(--accent-purple);
            font-size: 0.95rem;
            color: var(--text-secondary);
        }

        /* Positions */
        .positions-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin: 24px 0;
            padding: 20px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 12px;
        }

        .position-box {
            background: linear-gradient(135deg, rgba(76, 201, 240, 0.1), rgba(114, 9, 183, 0.1));
            padding: 16px;
            border-radius: 10px;
            border: 1px solid rgba(76, 201, 240, 0.3);
            text-align: center;
        }

        .role-name {
            font-weight: 700;
            color: var(--accent-blue);
            margin-bottom: 6px;
            font-size: 1.1rem;
        }

        .role-position {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        /* Tips & Warnings */
        .tip-box, .warning-box, .notes-box {
            padding: 16px 20px;
            border-radius: 10px;
            margin: 16px 0;
            border-left: 4px solid;
        }

        .tip-box {
            background: rgba(6, 255, 165, 0.1);
            border-color: var(--success);
        }

        .warning-box {
            background: rgba(255, 214, 10, 0.1);
            border-color: var(--warning);
        }

        .notes-box {
            background: rgba(76, 201, 240, 0.1);
            border-color: var(--accent-blue);
        }

        .tip-box strong {
            color: var(--success);
        }

        .warning-box strong {
            color: var(--warning);
        }

        .notes-box strong {
            color: var(--accent-blue);
        }

        .video-box {
            padding: 16px 20px;
            border-radius: 10px;
            margin: 16px 0;
            border-left: 4px solid var(--accent-purple);
            background: rgba(114, 9, 183, 0.1);
        }

        .video-box strong {
            color: var(--accent-purple);
        }

        /* Images */
        .images-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 16px;
            margin: 24px 0;
        }

        .image-container {
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid rgba(255, 255, 255, 0.1);
            background: rgba(0, 0, 0, 0.3);
            max-width: 600px;
        }

        .image-container:hover {
            transform: scale(1.3);
            border-color: var(--accent-pink);
            box-shadow: 0 8px 64px rgba(255, 107, 157, 0.3);
        }

        .image-container img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* File Upload */
        .file-upload {
            background: var(--bg-card);
            padding: 30px;
            border-radius: 16px;
            text-align: center;
            margin-bottom: 30px;
            border: 2px dashed rgba(255, 107, 157, 0.3);
        }

        .file-upload input {
            display: none;
        }

        .file-upload label {
            display: inline-block;
            padding: 12px 24px;
            background: linear-gradient(135deg, var(--accent-pink), var(--accent-purple));
            color: white;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .file-upload label:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(255, 107, 157, 0.4);
        }

        /* Responsive */
        @media (max-width: 768px) {
            h1 {
                font-size: 2rem;
            }

            .mechanic-title {
                font-size: 1.4rem;
            }

            .nav-grid {
                grid-template-columns: 1fr;
            }

            .positions-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        /* Scroll behavior */
        html {
            scroll-behavior: smooth;
            scroll-padding-top: 200px; /* Offset for sticky nav */
        }

        /* Loading state */
        .loading {
            text-align: center;
            padding: 60px;
            font-size: 1.2rem;
            color: var(--text-secondary);
        }

        /* Defaults Section */
        .defaults-section {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 30px;
            border: 2px solid var(--accent-blue);
        }

        .defaults-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            margin-bottom: 20px;
        }

        .defaults-title {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--accent-blue);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .defaults-toggle {
            font-size: 1.5rem;
            color: var(--text-secondary);
            transition: transform 0.3s ease;
        }

        .defaults-section.collapsed .defaults-toggle {
            transform: rotate(-90deg);
        }

        .defaults-content {
            max-height: 3000px;
            overflow: hidden;
            transition: max-height 0.3s ease;
        }

        .defaults-section.collapsed .defaults-content {
            max-height: 0;
        }

        .defaults-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .default-box {
            background: rgba(0, 0, 0, 0.2);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid rgba(76, 201, 240, 0.3);
        }

        .default-box-title {
            font-weight: 700;
            color: var(--accent-blue);
            margin-bottom: 12px;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .copy-button {
            background: var(--accent-blue);
            color: var(--bg-primary);
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .copy-button:hover {
            background: var(--success);
            transform: scale(1.05);
        }

        .copy-button:active {
            transform: scale(0.95);
        }

        .macro-text {
            background: rgba(0, 0, 0, 0.4);
            padding: 16px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            white-space: pre-wrap;
            color: var(--text-primary);
            line-height: 1.6;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .clock-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            margin-top: 12px;
        }

        .clock-item {
            background: rgba(76, 201, 240, 0.1);
            padding: 10px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .clock-role {
            font-weight: 600;
            color: var(--accent-blue);
        }

        .clock-position {
            color: var(--text-secondary);
        }

        .light-parties {
            margin-top: 12px;
        }

        .lp-item {
            background: rgba(76, 201, 240, 0.1);
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 8px;
        }

        .lp-label {
            font-weight: 600;
            color: var(--accent-blue);
            margin-right: 8px;
        }

        .default-notes {
            background: rgba(76, 201, 240, 0.05);
            padding: 16px;
            border-radius: 8px;
            border-left: 3px solid var(--accent-blue);
            color: var(--text-secondary);
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="app">
            <div class="file-upload">
                <h2 style="margin-bottom: 20px;">Load Your Raid Guide JSON</h2>
                <input type="file" id="fileInput" accept=".json">
                <label for="fileInput">📁 Choose JSON File</label>
            </div>
            <div class="loading">Loading guide...</div>
        </div>
    </div>

    <script>
        let guideData = null;

        // Try to load the configured guide JSON file
        fetch(GUIDE_JSON_FILE)
            .then(response => response.json())
            .then(data => {
                guideData = data;
                renderGuide();
            })
            .catch(() => {
                document.querySelector('.loading').textContent = `Could not load ${GUIDE_JSON_FILE}. Make sure the JSON file is in the same folder.`;
            });

        // File upload handler
        document.getElementById('fileInput').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        guideData = JSON.parse(event.target.result);
                        renderGuide();
                    } catch (error) {
                        alert('Error parsing JSON file: ' + error.message);
                    }
                };
                reader.readAsText(file);
            }
        });

        function renderGuide() {
            const app = document.getElementById('app');
            
            // Header
            let html = `
                <header>
                    <h1>${guideData.raidName}</h1>
                    <p class="subtitle">${guideData.tier} • ${guideData.patch || ''}</p>
                </header>
            `;

            // Defaults Section (if exists)
            if (guideData.defaults) {
                html += `
                    <div class="defaults-section" id="defaultsSection">
                        <div class="defaults-header" onclick="toggleDefaults()">
                            <div class="defaults-title">
                                ⚙️ Default Positions & Macros
                            </div>
                            <div class="defaults-toggle">▼</div>
                        </div>
                        <div class="defaults-content">
                `;

                // Macro
                if (guideData.defaults.macro) {
                    html += `
                        <div class="default-box">
                            <div class="default-box-title">
                                📋 Macro
                                <button class="copy-button" onclick="copyToClipboard(\`${escapeForJS(guideData.defaults.macro)}\`, this)">Copy</button>
                            </div>
                            <div class="macro-text">${guideData.defaults.macro}</div>
                        </div>
                    `;
                }

                // Waymarks
                if (guideData.defaults.waymarks) {
                    // Check if it's a single string (old format) or object with multiple sets (new format)
                    if (typeof guideData.defaults.waymarks === 'string') {
                        // Single waymark set (backward compatible)
                        html += `
                            <div class="default-box">
                                <div class="default-box-title">
                                    📍 Waymarks
                                    <button class="copy-button" onclick="copyToClipboard(\`${escapeForJS(guideData.defaults.waymarks)}\`, this)">Copy</button>
                                </div>
                                <div class="macro-text">${guideData.defaults.waymarks}</div>
                            </div>
                        `;
                    } else {
                        // Multiple waymark sets
                        for (const [setName, waymarkData] of Object.entries(guideData.defaults.waymarks)) {
                            html += `
                                <div class="default-box">
                                    <div class="default-box-title">
                                        📍 ${setName}
                                        <button class="copy-button" onclick="copyToClipboard(\`${escapeForJS(waymarkData)}\`, this)">Copy</button>
                                    </div>
                                    <div class="macro-text">${waymarkData}</div>
                                </div>
                            `;
                        }
                    }
                }

                // Grid for Clock Spots and Light Parties
                html += `<div class="defaults-grid">`;

                // Clock Spots
                if (guideData.defaults.clockSpots) {
                    html += `
                        <div class="default-box">
                            <div class="default-box-title">🕐 Clock Spots</div>
                            <div class="clock-grid">
                    `;
                    for (const [role, position] of Object.entries(guideData.defaults.clockSpots)) {
                        html += `
                            <div class="clock-item">
                                <span class="clock-role">${role}</span>
                                <span class="clock-position">${position}</span>
                            </div>
                        `;
                    }
                    html += `
                            </div>
                        </div>
                    `;
                }

                // Light Parties
                if (guideData.defaults.lightParties) {
                    html += `
                        <div class="default-box">
                            <div class="default-box-title">👥 Light Parties</div>
                            <div class="light-parties">
                    `;
                    for (const [group, members] of Object.entries(guideData.defaults.lightParties)) {
                        html += `
                            <div class="lp-item">
                                <span class="lp-label">${group}:</span>
                                <span>${members}</span>
                            </div>
                        `;
                    }
                    html += `
                            </div>
                        </div>
                    `;
                }

                html += `</div>`; // Close defaults-grid

                // Default Images (multiple)
                if (guideData.defaults.images && guideData.defaults.images.length > 0) {
                    html += `<div class="images-grid">`;
                    guideData.defaults.images.forEach(img => {
                        html += `
                            <div class="image-container">
                                <img src="${img}" alt="Default Reference" loading="lazy">
                            </div>
                        `;
                    });
                    html += `</div>`;
                }

                // Notes
                if (guideData.defaults.notes) {
                    html += `
                        <div class="default-notes">
                            <strong>Note:</strong> ${linkifyText(guideData.defaults.notes)}
                        </div>
                    `;
                }

                html += `
                        </div>
                    </div>
                `;
            }

            html += `
                <div class="nav-container" id="navContainer">
                    <div class="nav-header" onclick="toggleNav()">
                        <div class="nav-title">⚡ Quick Navigation</div>
                        <div class="nav-toggle">▼</div>
                    </div>
                    <div class="nav-content">
                        <div class="nav-grid">
            `;

// Navigation links
            guideData.mechanics.forEach((mech, index) => {
                const timestamp = mech.timestamp ? `<span style="opacity: 0.6; font-size: 0.85em; white-space: nowrap;">⏱️ ${mech.timestamp}</span>` : '';
                const damage = mech.damage ? `<span style="opacity: 0.8; font-size: 0.75em; color: var(--danger); background: rgba(255, 94, 91, 0.15); padding: 2px 8px; border-radius: 4px; white-space: nowrap;">💥 ${mech.damage}</span>` : '';
                html += `
                    <a href="#${mech.id}" class="nav-link">
                        <div style="display: flex; flex-direction: column; gap: 6px; flex: 1;">
                            <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 8px;">
                                <span style="flex: 1; min-width: 0;">${mech.name}</span>
                                ${timestamp ? `<span style="flex-shrink: 0;">${timestamp}</span>` : ''}
                            </div>
                            <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px;">
                                <span class="category-badge" style="flex-shrink: 0;">${mech.category}</span>
                                ${damage ? `<span style="flex-shrink: 0;">${damage}</span>` : ''}
                            </div>
                        </div>
                    </a>
                `;
            });

            html += `
                        </div>
                    </div>
                </div>
                <div id="mechanics-container">
            `;

            // Mechanic cards
            guideData.mechanics.forEach((mech, index) => {
                html += `
                    <div class="mechanic-card" id="${mech.id}">
                        <div class="mechanic-header" onclick="toggleCard(this.parentElement)">
                            <div class="mechanic-number">${index + 1}</div>
                            <div class="mechanic-title-group">
                                <div class="mechanic-title">${mech.name}</div>
                                <span class="mechanic-category">${mech.category}</span>
                                ${mech.timestamp ? `<span class="mechanic-timestamp">⏱️ ${mech.timestamp}</span>` : ''}
                                ${mech.damage ? `<span class="mechanic-damage">💥 ${mech.damage}</span>` : ''}
                            </div>
                            <div class="collapse-icon">▼</div>
                        </div>
                        <div class="mechanic-content">
                `;

                // Description
                if (mech.description) {
                    html += `<div class="mechanic-description">${linkifyText(mech.description)}</div>`;
                }

                // Video
                if (mech.video) {
                    html += `<div class="video-box"><strong>🎥 Video:</strong> ${linkifyText(mech.video)}</div>`;
                }

                // Steps
                if (mech.steps && mech.steps.length > 0) {
                    html += `<div class="steps-list">`;
                    mech.steps.forEach(step => {
                        html += `<div class="step-item">`;
                        html += `<div class="step-text">${linkifyText(step.text || step)}</div>`;
                        if (step.substeps) {
                            html += `<div class="substeps">`;
                            step.substeps.forEach(substep => {
                                html += `<div class="substep">→ ${linkifyText(substep)}</div>`;
                            });
                            html += `</div>`;
                        }
                        html += `</div>`;
                    });
                    html += `</div>`;
                }

                // Positions
                if (mech.positions) {
                    html += `<div class="positions-grid">`;
                    for (const [role, position] of Object.entries(mech.positions)) {
                        if (typeof position === 'string') {
                            html += `
                                <div class="position-box">
                                    <div class="role-name">${role}</div>
                                    <div class="role-position">${position}</div>
                                </div>
                            `;
                        }
                    }
                    html += `</div>`;
                }

                // Images
                if (mech.images && mech.images.length > 0) {
                    html += `<div class="images-grid">`;
                    mech.images.forEach(img => {
                        html += `
                            <div class="image-container">
                                <img src="${img}" alt="${mech.name}" loading="lazy">
                            </div>
                        `;
                    });
                    html += `</div>`;
                }

                // Tips
                if (mech.tips && mech.tips.length > 0) {
                    html += `<div class="tip-box"><strong>💡 Tips:</strong><ul style="margin-left: 20px; margin-top: 8px;">`;
                    mech.tips.forEach(tip => {
                        html += `<li>${linkifyText(tip)}</li>`;
                    });
                    html += `</ul></div>`;
                }

                // Warning
                if (mech.warning) {
                    html += `<div class="warning-box"><strong>⚠️ Warning:</strong> ${linkifyText(mech.warning)}</div>`;
                }

                // Notes
                if (mech.notes) {
                    html += `<div class="notes-box"><strong>📝 Note:</strong> ${linkifyText(mech.notes)}</div>`;
                }

                html += `
                        </div>
                    </div>
                `;
            });

            html += `</div>`;
            app.innerHTML = html;
        }

        function toggleCard(card) {
            card.classList.toggle('collapsed');
        }

        function toggleNav() {
            document.getElementById('navContainer').classList.toggle('collapsed');
        }

        function toggleDefaults() {
            document.getElementById('defaultsSection').classList.toggle('collapsed');
        }

        function escapeForJS(str) {
            return str.replace(/`/g, '\\`').replace(/\$/g, '\\$');
        }

        function copyToClipboard(text, button) {
            navigator.clipboard.writeText(text).then(() => {
                const originalText = button.textContent;
                button.textContent = 'Copied!';
                button.style.background = 'var(--success)';
                setTimeout(() => {
                    button.textContent = originalText;
                    button.style.background = '';
                }, 2000);
            }).catch(err => {
                console.error('Failed to copy:', err);
                button.textContent = 'Error';
                setTimeout(() => {
                    button.textContent = 'Copy';
                }, 2000);
            });
        }

        function linkifyText(text) {
            // Regex to detect URLs
            const urlRegex = /(https?:\/\/[^\s]+)/g;
            return text.replace(urlRegex, '<a href="$1" target="_blank" rel="noopener noreferrer" style="color: var(--accent-blue); text-decoration: underline;">$1</a>');
        }

        // Expand card when navigating to it
        document.addEventListener('DOMContentLoaded', () => {
            if (window.location.hash) {
                const targetCard = document.querySelector(window.location.hash);
                if (targetCard) {
                    targetCard.classList.remove('collapsed');
                }
            }
        });
    </script>
</body>
</html>
