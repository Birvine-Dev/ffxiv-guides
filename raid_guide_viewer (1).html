<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FFXIV Raid Guide Viewer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0a0e27;
            --bg-secondary: #151934;
            --bg-card: #1a1f3a;
            --accent-pink: #ff6b9d;
            --accent-blue: #4cc9f0;
            --accent-purple: #7209b7;
            --text-primary: #f0f0f0;
            --text-secondary: #a0a0b0;
            --success: #06ffa5;
            --warning: #ffd60a;
            --danger: #ff5e5b;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, var(--bg-primary) 0%, var(--bg-secondary) 100%);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        /* Header */
        header {
            text-align: center;
            padding: 40px 20px;
            margin-bottom: 40px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
        }

        h1 {
            font-size: 3rem;
            font-weight: 900;
            background: linear-gradient(135deg, var(--accent-pink), var(--accent-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
            letter-spacing: -1px;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 1.2rem;
        }

        /* Navigation */
        .nav-container {
            position: sticky;
            top: 20px;
            background: var(--bg-card);
            padding: 20px;
            border-radius: 16px;
            margin-bottom: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 100;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .nav-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            user-select: none;
        }

        .nav-title {
            font-weight: 700;
            color: var(--accent-pink);
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-toggle {
            font-size: 1.5rem;
            color: var(--text-secondary);
            transition: transform 0.3s ease;
        }

        .nav-container.collapsed .nav-toggle {
            transform: rotate(-90deg);
        }

        .nav-content {
            max-height: 500px;
            overflow: hidden;
            transition: max-height 0.3s ease;
            margin-top: 15px;
        }

        .nav-container.collapsed .nav-content {
            max-height: 0;
            margin-top: 0;
        }

        .nav-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 8px;
        }

        .nav-link {
            color: var(--text-secondary);
            text-decoration: none;
            padding: 10px 14px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.03);
            transition: all 0.2s ease;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-link:hover {
            background: rgba(255, 107, 157, 0.15);
            color: var(--accent-pink);
            transform: translateX(4px);
        }

        .category-badge {
            font-size: 0.7rem;
            padding: 2px 8px;
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.1);
            margin-left: auto;
        }

        /* Mechanic Cards */
        .mechanic-card {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 24px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .mechanic-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 40px rgba(255, 107, 157, 0.2);
            border-color: var(--accent-pink);
        }

        .mechanic-header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 20px;
            cursor: pointer;
        }

        .mechanic-number {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, var(--accent-pink), var(--accent-purple));
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 1.5rem;
            flex-shrink: 0;
        }

        .mechanic-title-group {
            flex: 1;
        }

        .mechanic-title {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 4px;
        }

        .mechanic-category {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            background: rgba(76, 201, 240, 0.2);
            color: var(--accent-blue);
        }

        .mechanic-timestamp {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            background: rgba(6, 255, 165, 0.2);
            color: var(--success);
            margin-left: 8px;
        }

        .collapse-icon {
            font-size: 1.5rem;
            color: var(--text-secondary);
            transition: transform 0.3s ease;
        }

        .mechanic-card.collapsed .collapse-icon {
            transform: rotate(-90deg);
        }

        .mechanic-content {
            max-height: 5000px;
            overflow: hidden;
            transition: max-height 0.3s ease;
        }

        .mechanic-card.collapsed .mechanic-content {
            max-height: 0;
        }

        .mechanic-description {
            font-size: 1.1rem;
            line-height: 1.8;
            margin-bottom: 24px;
            color: var(--text-primary);
            padding: 16px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 8px;
            border-left: 3px solid var(--accent-blue);
        }

        /* Steps */
        .steps-list {
            margin: 20px 0;
        }

        .step-item {
            margin-bottom: 16px;
            padding-left: 32px;
            position: relative;
        }

        .step-item::before {
            content: '';
            position: absolute;
            left: 8px;
            top: 8px;
            width: 12px;
            height: 12px;
            background: var(--success);
            border-radius: 50%;
            box-shadow: 0 0 12px var(--success);
        }

        .step-text {
            font-size: 1.05rem;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        .substeps {
            margin-left: 24px;
            margin-top: 12px;
        }

        .substep {
            padding: 8px 12px;
            margin-bottom: 8px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 6px;
            border-left: 2px solid var(--accent-purple);
            font-size: 0.95rem;
            color: var(--text-secondary);
        }

        /* Positions */
        .positions-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 12px;
            margin: 24px 0;
            padding: 20px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 12px;
        }

        .position-box {
            background: linear-gradient(135deg, rgba(76, 201, 240, 0.1), rgba(114, 9, 183, 0.1));
            padding: 16px;
            border-radius: 10px;
            border: 1px solid rgba(76, 201, 240, 0.3);
            text-align: center;
            transition: all 0.2s ease;
        }

        .position-box:hover {
            background: linear-gradient(135deg, rgba(76, 201, 240, 0.2), rgba(114, 9, 183, 0.2));
            transform: scale(1.05);
        }

        .role-name {
            font-weight: 700;
            color: var(--accent-blue);
            margin-bottom: 6px;
            font-size: 1.1rem;
        }

        .role-position {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        /* Tips & Warnings */
        .tip-box, .warning-box, .notes-box {
            padding: 16px 20px;
            border-radius: 10px;
            margin: 16px 0;
            border-left: 4px solid;
        }

        .tip-box {
            background: rgba(6, 255, 165, 0.1);
            border-color: var(--success);
        }

        .warning-box {
            background: rgba(255, 214, 10, 0.1);
            border-color: var(--warning);
        }

        .notes-box {
            background: rgba(76, 201, 240, 0.1);
            border-color: var(--accent-blue);
        }

        .tip-box strong {
            color: var(--success);
        }

        .warning-box strong {
            color: var(--warning);
        }

        .notes-box strong {
            color: var(--accent-blue);
        }

        /* Images */
        .images-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 16px;
            margin: 24px 0;
        }

        .image-container {
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid rgba(255, 255, 255, 0.1);
            background: rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
        }

        .image-container:hover {
            transform: scale(1.02);
            border-color: var(--accent-pink);
            box-shadow: 0 8px 32px rgba(255, 107, 157, 0.3);
        }

        .image-container img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* File Upload */
        .file-upload {
            background: var(--bg-card);
            padding: 30px;
            border-radius: 16px;
            text-align: center;
            margin-bottom: 30px;
            border: 2px dashed rgba(255, 107, 157, 0.3);
        }

        .file-upload input {
            display: none;
        }

        .file-upload label {
            display: inline-block;
            padding: 12px 24px;
            background: linear-gradient(135deg, var(--accent-pink), var(--accent-purple));
            color: white;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .file-upload label:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(255, 107, 157, 0.4);
        }

        /* Responsive */
        @media (max-width: 768px) {
            h1 {
                font-size: 2rem;
            }

            .mechanic-title {
                font-size: 1.4rem;
            }

            .nav-grid {
                grid-template-columns: 1fr;
            }

            .positions-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        /* Scroll behavior */
        html {
            scroll-behavior: smooth;
        }

        /* Loading state */
        .loading {
            text-align: center;
            padding: 60px;
            font-size: 1.2rem;
            color: var(--text-secondary);
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="app">
            <div class="file-upload">
                <h2 style="margin-bottom: 20px;">Load Your Raid Guide JSON</h2>
                <input type="file" id="fileInput" accept=".json">
                <label for="fileInput">📁 Choose JSON File</label>
            </div>
            <div class="loading">Loading guide...</div>
        </div>
    </div>

    <script>
        let guideData = null;

        // Try to load default guide
        fetch('m5s_guide.json')
            .then(response => response.json())
            .then(data => {
                guideData = data;
                renderGuide();
            })
            .catch(() => {
                document.querySelector('.loading').textContent = 'No default guide found. Please upload a JSON file.';
            });

        // File upload handler
        document.getElementById('fileInput').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        guideData = JSON.parse(event.target.result);
                        renderGuide();
                    } catch (error) {
                        alert('Error parsing JSON file: ' + error.message);
                    }
                };
                reader.readAsText(file);
            }
        });

        function renderGuide() {
            const app = document.getElementById('app');
            
            // Header
            let html = `
                <header>
                    <h1>${guideData.raidName}</h1>
                    <p class="subtitle">${guideData.tier} • ${guideData.patch || ''}</p>
                </header>

                <div class="nav-container" id="navContainer">
                    <div class="nav-header" onclick="toggleNav()">
                        <div class="nav-title">⚡ Quick Navigation</div>
                        <div class="nav-toggle">▼</div>
                    </div>
                    <div class="nav-content">
                        <div class="nav-grid">
            `;

            // Navigation links
            guideData.mechanics.forEach((mech, index) => {
                html += `
                    <a href="#${mech.id}" class="nav-link">
                        ${mech.name}
                        <span class="category-badge">${mech.category}</span>
                    </a>
                `;
            });

            html += `
                        </div>
                    </div>
                </div>
                <div id="mechanics-container">
            `;

            // Mechanic cards
            guideData.mechanics.forEach((mech, index) => {
                html += `
                    <div class="mechanic-card" id="${mech.id}" onclick="toggleCard(this)">
                        <div class="mechanic-header">
                            <div class="mechanic-number">${index + 1}</div>
                            <div class="mechanic-title-group">
                                <div class="mechanic-title">${mech.name}</div>
                                <span class="mechanic-category">${mech.category}</span>
                                ${mech.timestamp ? `<span class="mechanic-timestamp">⏱️ ${mech.timestamp}</span>` : ''}
                            </div>
                            <div class="collapse-icon">▼</div>
                        </div>
                        <div class="mechanic-content">
                `;

                // Description
                if (mech.description) {
                    html += `<div class="mechanic-description">${mech.description}</div>`;
                }

                // Steps
                if (mech.steps && mech.steps.length > 0) {
                    html += `<div class="steps-list">`;
                    mech.steps.forEach(step => {
                        html += `<div class="step-item">`;
                        html += `<div class="step-text">${step.text || step}</div>`;
                        if (step.substeps) {
                            html += `<div class="substeps">`;
                            step.substeps.forEach(substep => {
                                html += `<div class="substep">→ ${substep}</div>`;
                            });
                            html += `</div>`;
                        }
                        html += `</div>`;
                    });
                    html += `</div>`;
                }

                // Positions
                if (mech.positions) {
                    html += `<div class="positions-grid">`;
                    for (const [role, position] of Object.entries(mech.positions)) {
                        if (typeof position === 'string') {
                            html += `
                                <div class="position-box">
                                    <div class="role-name">${role}</div>
                                    <div class="role-position">${position}</div>
                                </div>
                            `;
                        }
                    }
                    html += `</div>`;
                }

                // Images
                if (mech.images && mech.images.length > 0) {
                    html += `<div class="images-grid">`;
                    mech.images.forEach(img => {
                        html += `
                            <div class="image-container">
                                <img src="${img}" alt="${mech.name}" loading="lazy">
                            </div>
                        `;
                    });
                    html += `</div>`;
                }

                // Tips
                if (mech.tips && mech.tips.length > 0) {
                    html += `<div class="tip-box"><strong>💡 Tips:</strong><ul style="margin-left: 20px; margin-top: 8px;">`;
                    mech.tips.forEach(tip => {
                        html += `<li>${tip}</li>`;
                    });
                    html += `</ul></div>`;
                }

                // Warning
                if (mech.warning) {
                    html += `<div class="warning-box"><strong>⚠️ Warning:</strong> ${mech.warning}</div>`;
                }

                // Notes
                if (mech.notes) {
                    html += `<div class="notes-box"><strong>📝 Note:</strong> ${mech.notes}</div>`;
                }

                html += `
                        </div>
                    </div>
                `;
            });

            html += `</div>`;
            app.innerHTML = html;
        }

        function toggleCard(card) {
            card.classList.toggle('collapsed');
        }

        function toggleNav() {
            document.getElementById('navContainer').classList.toggle('collapsed');
        }

        // Expand card when navigating to it
        document.addEventListener('DOMContentLoaded', () => {
            if (window.location.hash) {
                const targetCard = document.querySelector(window.location.hash);
                if (targetCard) {
                    targetCard.classList.remove('collapsed');
                }
            }
        });
    </script>
</body>
</html>
